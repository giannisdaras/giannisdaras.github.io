name: Deploy site

# Builds the site and publishes _site to the gh-pages branch, which GitHub
# Pages serves verbatim. The site cannot use the legacy Pages build: that
# runs a fixed gem allowlist with no jekyll-scholar, so the bibliography
# would not render at all.
#
# This replaces al-folio's shipped workflow, which assumed a checkout this
# repo does not have: it ran `npm ci` (there is no package-lock.json; npm
# here is only prettier and playwright, which the build never touches) and
# `purgecss -c purgecss.config.js` (no such file). Both failed the job.

on:
  push:
    branches: [master, redesign-alfolio]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install imagemagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Check the build
        run: |
          test -s _site/index.html
          test -s _site/publications/index.html
          test -s _site/CNAME
          # the bibliography is the thing the legacy build could not produce
          grep -q 'ol class="bibliography"' _site/publications/index.html
          # Pages must serve the output as-is, not try to build it again
          touch _site/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          single-commit: true
